{% extends "base.html" %}
{% block title %}Erreur — PyVolley{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-8" style="min-height: 50vh;">
    <div class="card p-8 text-center" style="max-width: 400px;">
        <i data-lucide="alert-triangle" class="w-10 h-10 mx-auto mb-3" style="color: var(--accent-primary); opacity: 0.6;"></i>
        <h1 class="text-lg font-bold text-primary mb-2">Erreur</h1>
        <p class="text-sm text-secondary">{{ message }}</p>
        <a href="/" class="btn-primary mt-4 inline-flex no-underline">
            <i data-lucide="home" class="w-4 h-4"></i> Retour à l'accueil
        </a>
    </div>
</div>
{% endblock %}
